<html>
<head>
<title>Favorite movies</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    background: linear-gradient(135deg, red 0%, blue 100%);
    color: black;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  main {
    background: white;
    max-width: 720px;
    width: 100%;
    padding: 40px 50px;
    border-radius: 16px;
    box-shadow:
      0 4px 6px rgba(0,0,0,0.1),
      0 10px 20px rgba(0,0,0,0.05);
    border: 1px solid white;
    backdrop-filter: saturate(180%) blur(10px);
  }
  h1 {
    font-size: 3.2rem;
    margin-bottom: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #0b2d51;
    text-align: center;
    text-shadow: 1px 1px 3px rgba(11, 45, 81, 0.3);
  }
  ul {
    list-style-type: none;
    padding-left: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 1.4rem;
    color: darkblue;
  }
  ul li {
    position: relative;
    margin-bottom: 20px;
    padding-left: 30px;
    line-height: 1.8;
    cursor: default;
    transition: color 0.25s ease;
  }
  ul li::before {
    content: "★";
    position: absolute;
    left: 0;
    top: 0;
    color: gray;
    font-size: 1.3rem;
    line-height: 1.8;
    transition: color 0.25s ease;
  }
  ul li:hover {
    color:darkslategrey;
  }
  ul li:hover::before {
    color: orange;
  }
  ul li:focus-visible {
    outline: 3px solid orange;
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <main role="main" aria-labelledby="page-title">
    <h1 id="page-title" tabindex="0">My Favorite Movies</h1>
    <ul>
      <li tabindex="0">Chennai 600028</li>
      <li tabindex="0">Soorarai pottru</li>
      <li tabindex="0">Jathi ratnalu</li>
      <li tabindex="0">Good bad ugly</li>
      <li tabindex="0">Hera pheri</li>
    </ul>
  </main>
</body>
</html>
